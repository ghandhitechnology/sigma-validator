<!DOCTYPE html>
<html lang="en" data-locale-selector="root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SIGMA — Select language / 언어 선택</title>
  <meta name="description" content="Choose Korean or English for SIGMA, the startup idea validator. SIGMA 창업 아이디어 검증 도구의 언어를 선택하세요.">
  <meta name="author" content="Andy Ha">
  <meta property="og:title" content="SIGMA — Test your startup idea">
  <meta property="og:description" content="Choose your language. 언어를 선택하세요.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="alternate" hreflang="ko" href="/ko/">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="x-default" href="/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1b17'/><text x='50' y='64' font-size='54' text-anchor='middle' fill='%23f2ecda'>Σ</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/locale-selector.js"></script>
</head>
<body class="selector-page">
  <main class="selector-shell" aria-labelledby="selectorTitle">
    <header class="selector-head">
      <div class="seal" aria-hidden="true">Σ</div>
      <div><strong>SIGMA</strong><p>Startup idea check · 창업 아이디어 검증</p></div>
    </header>
    <section class="selector-content">
      <h1 id="selectorTitle">Choose your language.<br>언어를 선택하세요.</h1>
      <p class="selector-intro">Your choice applies to the whole tool and the report. 선택한 언어는 전체 화면과 평가 결과에 적용됩니다.</p>
      <div class="language-grid">
        <a class="language-card" href="/ko/" data-locale="ko" lang="ko" hreflang="ko">
          <span class="language-code" aria-hidden="true">가</span>
          <span><strong>한국어</strong><span>한국어로 계속하기</span></span>
          <span class="language-arrow" aria-hidden="true">→</span>
        </a>
        <a class="language-card" href="/en/" data-locale="en" lang="en" hreflang="en">
          <span class="language-code" aria-hidden="true">A</span>
          <span><strong>English</strong><span>Continue in English</span></span>
          <span class="language-arrow" aria-hidden="true">→</span>
        </a>
      </div>
      <p class="selector-note">Only this choice is saved. 언어 선택만 저장됩니다.</p>
    </section>
  </main>
</body>
</html>
